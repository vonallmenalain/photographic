<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Farbe der Browser-Leiste: passt zur hellen Kopfzeile der Kundenapp. -->
    <meta name="theme-color" content="#f5f5f5" />
    <title>Photographic – Schul- und Kindergartenfotos von CreArt</title>
    <!-- Kleine Foto-Collage statt des Standard-Symbols im Browser-Tab.
         Moderne Browser bevorzugen das SVG; ältere ignorieren es einfach. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="description"
      content="Bestellplattform von CreArt – Beatrice von Allmen, Burgdorf: Schul- und Kindergartenfotos als Download und Druck, Preise in CHF, Lieferung in die Schweiz. Fotos nur nach Bestätigung der E-Mail-Adresse sichtbar."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Die Website-Schrift ist "Comic Sans MS". Sie ist auf Windows und macOS
         vorinstalliert, fehlt aber auf Android, iOS und Linux. Als Ersatz laden
         wir dort "Comic Neue" (die freie, OFL-lizenzierte Schwester von Comic
         Sans), damit die Schrift überall gleich wirkt. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
